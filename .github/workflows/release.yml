name: Release and Publish Artifacts

# Trigger: Only runs when a version tag (e.g., v1.0.0) is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Permissions required to push Docker images (packages) and create a GitHub Release (contents)
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Stage 1: Build and Prepare the JAR file ---
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        # We use 'package' and skip tests for speed, assuming the CI pipeline already validated the code.
        run: mvn -B clean package -DskipTests
        working-directory: ./backend

      # Identify the generated JAR file (filtering out potential sources/javadoc jars)
      - name: Identify JAR file
        id: find-jar
        run: |
          # Robustly find the executable JAR, excluding secondary artifacts
          # We look in the backend/target directory as the build ran there.
          JAR_FILE=$(ls backend/target/*.jar | grep -vE 'sources|javadoc')
          echo "JAR_PATH=${JAR_FILE}" >> $GITHUB_OUTPUT
          echo "Found JAR at: ${JAR_FILE}"

      # --- Stage 2: Build and Push Docker Image to GHCR ---
      # Log in to the GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Uses the built-in token for authentication
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker automatically
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image format: ghcr.io/your-username/your-repo-name
          images: ghcr.io/${{ github.repository }}
          # Auto-generates tags based on the git tag (e.g., v1.0.0) and adds 'latest'
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Build and Push the Docker Image
      # This uses the Dockerfile in ./backend, which copies the JAR built in Stage 1.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimize: Use GitHub Actions build cache for faster subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Stage 3: Create GitHub Release ---
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # Attach the JAR file identified in Stage 1
          artifacts: ${{ steps.find-jar.outputs.JAR_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Automatically generate release notes from commits
          generateReleaseNotes: true
          body: |
            ## NexusScholar Release ${{ github.ref_name }}
            
            This release contains the artifacts for the Large Scale Data Bases course (A.Y. 2025-2026).

            ### Artifacts
            1. **Executable JAR:** Attached below.
            2. **Docker Image:** `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`