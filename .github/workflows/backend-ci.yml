name: Backend CI, Quality, and Coverage

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-analyze-report:
    name: Build, Test, Analyze and Report
    runs-on: ubuntu-latest
    defaults:
      run:
        # IMPORTANT: All commands run inside the backend directory
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required by SonarCloud for accurate blame data
          fetch-depth: 0

      # Setup Java 25 (LTS)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Caching Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Caching SonarCloud scanner files
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 1. Check Code Formatting (Fail fast if formatting is incorrect)
      - name: Check Code Formatting (Spotless)
        run: mvn spotless:check

      # 2. Build, Test, and Analyze
      # 'verify' runs tests (JUnit + JaCoCo instrumentation).
      # The sonar plugin runs immediately after.
      - name: Build, Test and Analyze
        env:
          # GitHub token is required by Sonar for PR decoration
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your specific SonarCloud token (Set in GitHub Secrets)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=AndreaCovelli_NexusScholar

      # 3. Upload Coverage to Codecov
      # JaCoCo generated the report during the 'verify' phase
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # Your specific Codecov token (Set in GitHub Secrets)
          token: ${{ secrets.CODECOV_TOKEN }}
          # Specify the location of the XML report generated by JaCoCo
          files: ./backend/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true