# Local development profile - connects to localhost Docker containers
spring:
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/nexusscholar?authSource=admin
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password

logging:
  level:
    it.unipi.nexusscholar: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.neo4j.driver: DEBUG