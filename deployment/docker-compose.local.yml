x-mongo-command: &mongo-command >
  bash -c "cp /opt/keyfile/mongo-keyfile /etc/mongo-keyfile && 
  chmod 400 /etc/mongo-keyfile && 
  chown 999:999 /etc/mongo-keyfile && 
  docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all"

services:

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexusscholar-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo1:27017,mongo2:27017,mongo3:27017/${MONGO_DB_NAME}?replicaSet=rs0&authSource=admin&readPreference=secondaryPreferred
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USER}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - neo4j
    networks:
      - nexusscholar-net
    restart: on-failure

  mongo1:
    image: mongo:noble
    container_name: mongo1
    ports:
      - "27018:27017"
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: *mongo-command
    volumes:
      - mongo1_data:/data/db
      - ./mongo-keyfile:/opt/keyfile/mongo-keyfile
    networks:
      - nexusscholar-net

  mongo2:
    image: mongo:noble
    container_name: mongo2
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: *mongo-command
    volumes:
      - mongo2_data:/data/db
      - ./mongo-keyfile:/opt/keyfile/mongo-keyfile
    networks:
      - nexusscholar-net

  mongo3:
    image: mongo:noble
    container_name: mongo3
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: *mongo-command
    volumes:
      - mongo3_data:/data/db
      - ./mongo-keyfile:/opt/keyfile/mongo-keyfile
    networks:
      - nexusscholar-net

  neo4j:
    image: neo4j:enterprise
    container_name: nexusscholar-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 4G
    volumes:
      - neo4j_data:/data
      - ../data-pipeline/scripts/import_files/neo4j:/var/lib/neo4j/import
    networks:
      - nexusscholar-net

networks:
  nexusscholar-net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  neo4j_data: